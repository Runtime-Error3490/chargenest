<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="nestGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Nest/Home shape -->
  <path d="M100 25 L170 75 L170 160 C170 170 162 178 152 178 L48 178 C38 178 30 170 30 160 L30 75 Z" 
        fill="url(#nestGradient)" />
  
  <!-- Roof highlight -->
  <path d="M100 25 L170 75 L155 75 L100 35 L45 75 L30 75 Z" 
        fill="#34D399" opacity="0.5"/>
  
  <!-- Door/charging port shape -->
  <rect x="75" y="110" width="50" height="68" rx="8" fill="#065F46"/>
  
  <!-- Lightning bolt -->
  <path d="M112 70 L95 105 L108 105 L88 145 L105 110 L92 110 Z" 
        fill="url(#boltGradient)" />
  
  <!-- Subtle glow around bolt -->
  <path d="M112 70 L95 105 L108 105 L88 145 L105 110 L92 110 Z" 
        fill="none" stroke="#FCD34D" stroke-width="2" opacity="0.3"/>
</svg>
