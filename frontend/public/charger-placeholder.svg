<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="EV charger placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- ground -->
  <rect y="238" width="400" height="62" fill="#a7f3d0"/>
  <!-- charger body -->
  <rect x="165" y="70" width="70" height="168" rx="14" fill="#ffffff" stroke="#059669" stroke-width="5"/>
  <rect x="180" y="88" width="40" height="34" rx="6" fill="#d1fae5"/>
  <!-- bolt -->
  <path d="M203 92 L190 112 H199 L196 128 L211 106 H202 Z" fill="#059669"/>
  <circle cx="200" cy="150" r="5" fill="#34d399"/>
  <!-- holster -->
  <rect x="184" y="170" width="32" height="22" rx="5" fill="#059669"/>
  <!-- cable -->
  <path d="M235 190 C285 190 285 232 322 232" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round"/>
  <rect x="320" y="222" width="22" height="20" rx="5" fill="#047857"/>
  <!-- base -->
  <rect x="155" y="236" width="90" height="8" rx="4" fill="#047857"/>
</svg>
