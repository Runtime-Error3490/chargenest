# Render Blueprint for ChargeNest: one Docker web service (API + built React app) and a Postgres database.
# Render dashboard: New > Blueprint > pick this repo. Fill the "sync: false" values when asked.
# Free plans are fine for a demo. Free Postgres expires after 30 days; the free web service sleeps when idle.
# Uploaded charger photos are wiped on redeploy unless you use a paid plan and add a disk (see below).

databases:
  - name: chargenest-db
    plan: free
    databaseName: chargenest
    user: chargenest

services:
  - type: web
    name: chargenest
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    # Paid plans only: keep uploaded photos across deploys.
    # disk:
    #   name: uploads
    #   mountPath: /app/backend/uploads
    #   sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: chargenest-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: TOTP_ENCRYPTION_KEY
        generateValue: true
      - key: KYA_KEY_SECRET
        generateValue: true
      # FRONTEND_URL is not needed: the site address is read from each request.
      # PayPal sandbox (US business app)
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_MODE
        value: sandbox
      # Loads the demo users and chargers on start (demo_driver@example.com / REDACTED_PASSWORD). It re-creates the demo
      # bookings every time, so set it to "false" after the first successful deploy.
      - key: SEED_DEMO_DATA
        value: "true"
      - key: DEFAULT_CURRENCY
        value: USD
      # AI concierge: "mock" needs no key. Use openrouter or openai and add a key below for a real model.
      - key: AI_PROVIDER
        value: mock
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Device simulator on the booking page, so a hosted demo can finish a booking without hardware.
      # Without DEMO_MODE the mock stays off in production. Remove both for a real launch.
      - key: DEVICE_MOCK
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: WALLET_MOCK_CREDIT
        value: "0"
